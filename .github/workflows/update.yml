name: Release

on:
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        description: "Should this build ignore the caches and rescrape the whole wiki"
      build_container:
        type: boolean
        description: "Should this build also build a new Docker image"
  schedule:
    - cron: '41 */6 * * *' # At minute 41 past every 6th hour
    - cron: '12 5 1 * *' # At 05:12 on day-of-month 1.


env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  FULL_BUILD: ${{ github.event.schedule == '12 5 1 * *' || inputs.full }}
  BUILD_IMAGE: ${{ github.event.schedule == '12 5 1 * *' || inputs.build_container }}

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      docker_inputs_uploaded: ${{ steps.upload_docker_inputs.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Setup
        run: |
          npm --no-audit --progress=false ci

      - name: Download caches and remove expired files
        if: env.FULL_BUILD != 'true'
        run: |
          npm run download_caches
          npm run clear_recent_changes

      - name: Scrape and Build
        env:
          BUILD_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npm run build

      - name: Build final pack
        env:
          BUILD_ENV: production
        run: |
          # Temporarily move it out of the public dir to keep it out of the Cloudflare bundle
          # (it's too big, we upload it to R2 but include it in the docker image)
          mv --verbose ./public/search_index.json .
          if [ -f ./public/embeddings.bin ]; then mv --verbose ./public/embeddings.bin .; fi
          if [ -f ./public/embeddings_manifest.json ]; then mv --verbose ./public/embeddings_manifest.json .; fi
          npm run astrobuild


      # Remote cache
      - name: Prepare remote cache files
        run: |
          rm -f public_cache.zip build_cache.zip
          zip --recurse-paths -9 --quiet public_cache.zip ./public &
          zip --recurse-paths -9 --quiet build_cache.zip ./build/cache &
          wait

      - name: Upload storage assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          (npx wrangler r2 object put gmodwiki/public_cache.zip --remote --file ./public_cache.zip && rm -v public_cache.zip) &
          (npx wrangler r2 object put gmodwiki/build_cache.zip --remote --file ./build_cache.zip && rm -v build_cache.zip) &
          (npx wrangler r2 object put gmodwiki/search_index.json --remote --file ./search_index.json && mv ./search_index.json ./public/) &
          ([ -f ./embeddings.bin ] && npx wrangler r2 object put gmodwiki/embeddings.bin --remote --file ./embeddings.bin && mv ./embeddings.bin ./public/) &
          ([ -f ./embeddings_manifest.json ] && npx wrangler r2 object put gmodwiki/embeddings_manifest.json --remote --file ./embeddings_manifest.json && mv ./embeddings_manifest.json ./public/) &
          wait

      - name: Pack Docker build inputs
        if: env.BUILD_IMAGE == 'true'
        run: |
          tar --create --zstd --file docker_inputs.tar.zst ./public ./build/cache ./.astro

      - name: Upload Docker build inputs
        id: upload_docker_inputs
        if: env.BUILD_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-inputs
          path: docker_inputs.tar.zst
          compression-level: 0
          retention-days: 7

      - name: Sync embeddings into Vectorize
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -f ./public/embeddings.bin ]; then
            npm run vectorize_sync
          else
            echo "no embeddings artifact present; skipping Vectorize sync"
          fi

      # CF Publish
      - name: Publish Site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler pages deploy --project-name=gmodwiki ./dist

      - name: Clear CF Cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_CACHE_API_KEY: ${{ secrets.CF_CACHE_API_TOKEN }}
        run: |
          npm run clear_cloudflare_cache
          rm -f --verbose deleted_files.json

  image:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.docker_inputs_uploaded == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Docker build inputs
        uses: actions/download-artifact@v8
        with:
          name: docker-inputs

      - name: Unpack Docker build inputs
        run: |
          tar --extract --zstd --file docker_inputs.tar.zst
          rm --verbose docker_inputs.tar.zst

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ghcr.io/cfc-servers/gmodwiki:latest
