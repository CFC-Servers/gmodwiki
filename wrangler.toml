name = "gmodwiki"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "./dist/client"
binding = "ASSETS"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "gmodwiki-embeddings"
